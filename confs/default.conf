# ---------------------------------------------------------------------------
#  Configuración por defecto de webserv (sintaxis inspirada en nginx)
# ---------------------------------------------------------------------------

server {
    listen 8002;                        # puerto (se puede repetir, o "host:puerto")
    host 127.0.0.1;                     # interfaz en la que escuchar
    server_name localhost;              # nombres para elegir server por la cabecera Host
    root www;                           # raíz: URI /x -> www/x
    index index.html;                   # fichero por defecto de un directorio
    client_max_body_size 10m;           # límite del body (k, m, g). 0 = sin límite
    error_page 404 /error_pages/404.html;
    error_page 500 502 503 504 /error_pages/50x.html;

    location / {
        allow_methods GET POST DELETE;
        autoindex off;
    }

    location /tours {
        autoindex on;
        index tours1.html;
        allow_methods GET POST HEAD;
    }

    # Redirección HTTP (301 por defecto; también "return 302 /url;")
    location /red {
        return /tours;
    }

    # alias reemplaza el prefijo: /kapouet/pouic/toto -> www/kapouet/pouic/toto
    location /kapouet {
        alias www/kapouet;
        allow_methods GET;
    }

    # Subidas: POST guarda en upload_store, DELETE borra, GET lista
    location /uploads {
        allow_methods GET POST DELETE;
        autoindex on;
        upload_store www/uploads;
        client_max_body_size 50m;
    }

    # CGI: cgi_path[i] es el intérprete de cgi_ext[i]
    location /cgi-bin {
        allow_methods GET POST;
        index time.py;
        cgi_path /usr/bin/python3 /bin/bash;
        cgi_ext .py .sh;
    }
}

# Segundo server en otro puerto con un body máximo pequeño (para probar 413)
server {
    listen 8003;
    host 127.0.0.1;
    server_name example.local;
    root www;
    client_max_body_size 100;

    location / {
        allow_methods GET POST;
        upload_store www/uploads;
    }
}

server {
    listen 8111;
    host 127.0.0.1;
    server_name first.test;
    root www;
    index index.html;
    location / {
        allow_methods GET;
    }
}
server {
    listen 8111;
    host 127.0.0.1;
    server_name second.test;
    root www/tours;
    index tours1.html;
    location / {
        allow_methods GET;
    }
}

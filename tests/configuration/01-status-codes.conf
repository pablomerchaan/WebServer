server {
    listen 8101;
    host 127.0.0.1;
    server_name status.test;
    root www;
    index index.html;
    error_page 404 /error_pages/404.html;
    location / {
        allow_methods GET;
    }
    location /readonly {
        allow_methods GET;
    }
    location /red {
        return /;
    }
}
